# June 릴스 스타일.
# 값은 추측이 아니라 캡컷 0806 프로젝트의 텍스트 소재에서 실측한 것이다.
# (캡컷 단위 → 미리보기 렌더용 근사값. 최종 정확도는 캡컷 드래프트 출력(M2)에서 나온다)

layers:
  main:                       # 메인 자막
    font: Pretendard
    weight: medium            # Bold 아님 — Pretendard-Medium.otf
    color: "#FFFFFF"
    outline: 0.017            # 캡컷 stroke width. 아주 얇음
    shadow_alpha: 0.12        # 거의 안 보이는 그림자
    shadow_angle: -45
    y: -0.272                 # 캡컷 transform.y (화면 중앙 기준, 음수가 아래)
    scale_x: 0.84             # 가로로 눌러 씀
    one_line: true            # 두 줄로 접지 않는다

  clock:                      # 시각 표기 (7:30 같은)
    font: 메모먼트꾹꾹체        # MemomentKkukkukk.otf
    weight: bold
    color: "#FFD3F2"          # 연핑크
    outline: 0.0086
    shadow_alpha: 0.19
    y: -0.442                 # 메인보다 위
    size_ratio: 2.84          # 메인 대비

  aside:                      # 괄호 부연설명
    font: Pretendard
    weight: medium
    color: "#FFFFFF"
    outline: 0.017
    shadow_alpha: 0.12
    y: -0.589                 # 메인보다 아래
    size_ratio: 0.61
    scale_x: 0.87
    scale_y: 1.37

emphasis:
  color: "#FFD3F2"
  max_per_frame: 1
  syntax: "*강조할 말*"

cover:
  font: 메모먼트꾹꾹체
  color: "#FFFFFF"
