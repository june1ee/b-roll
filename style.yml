# June 릴스 스타일. 릴스마다 다시 정하지 않으려고 여기에 못 박는다.
# sauger 가 자막을 그릴 때 이 파일을 읽는다.

caption:                    # 자막·본문
  font: Pretendard
  weight: bold
  color: "#FFFFFF"
  outline: thin             # 아주 얇은 테두리
  shadow: soft              # 연한 그림자
  align: bottom
  margin_v: 320             # 릴스 하단 UI 안전영역

cover:                      # 커버 제목
  font: 메모먼트꾹꾹체
  color: "#FFFFFF"

emphasis:
  color: "#FFD3F2"          # 연핑크
  max_per_frame: 1          # 한 프레임에 하나만 — 핵심 단어 하나 또는 하이라이트 박스 한 줄
  syntax: "*강조할 말*"      # 자막 텍스트 안에서 별표로 감싼다
