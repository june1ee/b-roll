# 릴스 정의 예시. 실제 릴스 파일은 개인 내용이라 저장소에 올리지 않는다(.gitignore).
#
# 만드는 법:
#   uv run sauger init <캡컷프로젝트>     ← 녹음에서 줄 수·길이·배속을 읽어 뼈대를 만들어준다
#
# 돌리는 법:
#   uv run sauger build reels/<이름>.yml --from-capcut <캡컷프로젝트>
#   uv run sauger build --from-capcut <캡컷프로젝트>      ← 자막·러프컷까지 캡컷에 넣어뒀으면 yml 자체가 불필요

template: my-format      # 스타일을 가져올 캡컷 프로젝트. 폰트·크기·테두리·그림자·배속이 여기서 온다
ratio: "9:16"
# speed: 1.0             # 목소리 배속을 못 박고 싶을 때. 생략하면 템플릿 값,
#                        # --from-capcut 모드에서는 캡컷에서 건 값을 그대로 쓴다

lines:
  - t: "첫 줄 자막"
    src: clips/01.mov     # yml 파일 기준 상대경로. 캡컷 영상 트랙에 올려뒀다면 생략 가능
    clock: "7:30"         # 시각 레이어 (쓰는 포맷에서만)
    aside: "(괄호 부연)"    # 부연 레이어 (쓰는 포맷에서만)

  - t: "두 번째 줄, *여기만* 강조"   # *별표*로 감싸면 강조색. 한 프레임에 하나만
    src: clips/02.mov
    fit: start            # 러프컷이 길 때 어디를 남길지: center(기본) | start | end

  - t: "세 번째 줄"
    src: clips/03.mov
    from: 2.4             # 인점을 직접 못 박을 때(초)
    speed: 1.5            # 이 줄만 배속 다르게
    hold: 0.4             # 말이 끝나고 0.4초 더 유지
