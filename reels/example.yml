# A reel definition. Real reel files stay out of git (.gitignore) - they hold your script.
#
# Start one from a CapCut project that already has the voice recorded, one take per line:
#   broll init <capcut-project>        # reads the line count, lengths and speeds
#
# Build it:
#   broll build reels/<name>.yml --from-capcut <capcut-project>
#   broll build --from-capcut <capcut-project>   # no yml needed if captions and clips are in CapCut too

template: my-format      # CapCut project to copy the look from: fonts, sizes, strokes, shadows, speed
ratio: "9:16"
# speed: 1.0             # pin the voice speed. Defaults to the template's; with --from-capcut
#                        # the speed you set in CapCut is used as-is

lines:
  - t: "First caption"
    src: clips/01.mov     # relative to this file. Leave out if the clip is already on the CapCut video track
    clock: "7:30"         # clock layer (only if the template has one)
    aside: "(a side note)"  # aside layer (only if the template has one)

  - t: "Second line, *only this* stands out"   # *asterisks* colour the preview only; CapCut gets plain text
    src: clips/02.mov
    fit: start            # which part of a long rough clip to keep: center (default) | start | end

  - t: "Third line"
    src: clips/03.mov
    from: 2.4             # pin the in-point, in seconds
    speed: 1.5            # a different voice speed for this line
    hold: 0.4             # stay 0.4s after the voice ends
