[project]
name = "broll"
version = "0.1.0"
description = "릴스 조립기 - 줄별 녹음 트림, 타임라인 조립, 캡컷 드래프트 출력"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
broll = "broll.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/broll"]
